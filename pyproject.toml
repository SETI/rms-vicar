[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-vicar"
dynamic = ["version"]
description = "Routines for converting to and from VICAR image files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyparsing",
  "rms-filecache",
  "rms-vax"
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["vicar"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-vicar"
Documentation = "https://rms-vicar.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-vicar"
Source = "https://github.com/SETI/rms-vicar"
Issues = "https://github.com/SETI/rms-vicar/issues"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = ["-n", "auto", "--cov=src/vicar", "--strict-markers", "--strict-config"]
markers = []
filterwarnings = ["error"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker and type stub must be shipped in the wheel, or downstream type
# checkers ignore them.
vicar = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/vicar/_version.py"

[project.optional-dependencies]
dev = [
  "codespell>=2.4",
  "coverage>=7.0",
  "flake8",
  # mypy is not run against src (see CLAUDE.md), but stubtest ships with it
  "mypy>=1.0",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  # "bandit[toml]>=1.8",
  "pyroma>=4.2",
  # "vulture>=2.14",
  "rms-vicar[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Must match --cov in the pytest addopts above, or fail_under measures something else
source = ["src/vicar"]
omit = ["tests/*", "_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false
# stubtest discovers every module under the package and would compare each unannotated
# .py module against itself. Only __init__.pyi carries type information, so every other
# module is excluded from discovery; the override below keeps mypy from following an
# import into one of them.
exclude = [
  'vicar/(vicarlabel|vicarimage|_DEFINITIONS|_LABEL_GRAMMAR)\.py$',
]

[[tool.mypy.overrides]]
module = "vicar._version"
ignore_missing_imports = true

# The published type information lives in __init__.pyi, because the only supported
# import is from the package itself. Every other module is deliberately unannotated and
# has no stub, so mypy must not be turned loose on it. This override keeps mypy to the
# stub, which is what `mypy.stubtest` needs in order to run.
[[tool.mypy.overrides]]
module = [
  "vicar.vicarlabel",
  "vicar.vicarimage",
  "vicar._DEFINITIONS",
  "vicar._LABEL_GRAMMAR",
]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["filecache", "filecache.*", "vax", "vax.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
# Must match max-line-length in .flake8.
line-length = 90
exclude = [
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
# RUF005 - Collection literal concatenation. `(0,) + ints` reads as clearly as the
#   unpacked form it would be rewritten to.
# I001 - Import sorting. The fix collapses the column-aligned imports this codebase
#   uses (the same alignment .flake8 preserves by ignoring E221 and friends).
extend-ignore = ["PT011", "SIM105", "SIM108", "RUF005", "I001"]

[tool.ruff.lint.per-file-ignores]
# E501: test files are exempt from the line length limit so that expected-value
#   tables and VICAR label strings can stay readable.
"tests/*" = ["E501"]

# N999: _DEFINITIONS and _LABEL_GRAMMAR are upper case to mark them as tables of
#   constants; renaming them would break code that imports them.
"src/vicar/_DEFINITIONS.py" = ["N999"]
# E741: `l` is the location argument of every pyparsing parse action, following the
#   (s, l, t) convention in the pyparsing documentation.
"src/vicar/_LABEL_GRAMMAR.py" = ["N999", "E741"]

[tool.codespell]
# Two dictionaries: the default typo list, and the British-to-American list that
# enforces the spelling rule in .claude/rules/doc_python.md.
builtin = "clear,en-GB_to_en-US"
# The builtin British list carries a base word but not every inflection, so it
# catches `catalogue` and lets `catalogued` through. `.codespell-dictionary.txt`
# adds the inflections this tree uses, in codespell's `wrong->right` format --
# one pair per line, no comments or blank lines, which that parser rejects. The
# `-` is what keeps the builtins above: naming a dictionary without it replaces
# them rather than extending them, and it trails the filename because a value
# opening with `-` reads as another flag.
dictionary = ".codespell-dictionary.txt,-"
# Split on everything that is not an ASCII letter. The default word pattern
# keeps hyphens and apostrophes, which hides two whole classes: a compound like
# `optical-centre` is one unknown token, and -- because this project quotes
# strings with single quotes -- so is every string literal, `'colour'` included.
regex = "[a-zA-Z]+"
skip = "*/.git/*,*/_build/*,*/venv/*,*/.venv/*,*.lock,*.png,*.jpg,*.svg"
# Words the dictionaries flag that are correct here. Each is a term of art,
# an identifier, or a fragment the word pattern above creates -- not an
# exception granted to avoid fixing a real typo.
#   doub - the VICAR FORMAT code for a double-precision value, 'DOUB'.
#   indx - the index argument of the public VicarLabel.insert().
ignore-words-list = "doub,indx"

[tool.pymarkdown.extensions.front-matter]
# The rules and skills under .claude/ open with a YAML front-matter block, which would
# otherwise be read as a setext heading.
enabled = true

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

# Uncomment when enabling bandit in [project.optional-dependencies].dev.
# [tool.bandit]
# exclude_dirs = ["tests", "venv", ".venv"]
# targets = ["src"]

# Uncomment when enabling vulture in [project.optional-dependencies].dev.
# [tool.vulture]
# paths = ["src"]
# exclude = ["tests/"]
# min_confidence = 70
