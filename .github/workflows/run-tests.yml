name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-vicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # Ruff is the linter of record for every rule it implements.
      # TODO Add `ruff format --check src tests` once the source has been
      # reformatted.
      - name: Ruff
        run: |
          ruff check src tests

      # Ruff implements no rule in the E121-E133 range, so continuation-line
      # indentation is the one pycodestyle family it cannot gate. This step
      # matches `--flake8-cont` in scripts/run-all-checks.sh and reads the
      # per-file-ignores in .flake8.
      - name: Flake8 continuation-line indent
        run: |
          flake8 --select=E12,E13 src tests

      # Every module under tests/ is checked. src/ is unannotated, so mypy is kept off
      # it by the overrides in pyproject.toml; this step matches `--mypy` in
      # scripts/run-all-checks.sh.
      - name: Mypy
        run: |
          MYPYPATH=src mypy tests

      - name: Pyroma
        run: |
          pyroma .

      # -W makes warnings errors; docs/conf.py sets nitpicky = True, so a
      # cross-reference with no target fails the build too.
      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      - name: PyMarkdown
        run: |
          pymarkdown scan docs/ .claude/ README.md CONTRIBUTING.md

  test:
    name: Test rms-vicar
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          python -m pytest --cov=src --cov-report=xml -n auto tests

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
